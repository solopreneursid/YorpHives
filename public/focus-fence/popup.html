<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Fence</title><link rel="stylesheet" href="popup.css"><main><header>YorpHives <span>/ FOCUS FENCE</span></header><h1>Protect your focus.</h1><p class="note">Choose distracting domains and start a temporary block session.</p><label for="domains">One domain per line</label><textarea id="domains" rows="5" placeholder="reddit.com&#10;instagram.com&#10;youtube.com"></textarea><div class="row"><label for="minutes">Minutes</label><input id="minutes" type="number" min="1" max="240" value="25"></div><div class="buttons"><button id="save">Save domain list</button><button id="start" class="primary">Start focus</button><button id="stop">Stop / unblock</button></div><p id="status" role="status">Loading local settings…</p><footer>Blocks top-level page navigation for listed domains. No network service. Browser-internal pages and some embedded requests are not blocked.</footer><script src="popup.js"></script></main></html>
